<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Yusuke Kimura">
  <!--
    Source of truth for every icon on the site; scripts/build-icons.mjs
    rasterises this file into the PNG fallbacks.

    Two deliberate constraints:
    - The K is drawn as a path, not <text>, so it rasterises identically on
      every platform instead of depending on whichever serif is installed.
    - Stroke weight and proportions are tuned for 16x16 — the size that
      actually appears in a browser tab. Anything finer turns to mush there.
      The stem is centred on x=10 with a 4-unit stroke so that at 16px it
      lands exactly on pixels 4-6 instead of straddling two and blurring.
  -->
  <style>
    .plate { fill: #0c666e; }
    /* Browsers apply CSS inside an SVG favicon, so the tile can lift itself
       out of a dark tab bar. Rasterisers ignore this and use the attribute. */
    @media (prefers-color-scheme: dark) {
      .plate { fill: #14818c; }
    }
  </style>

  <rect class="plate" width="32" height="32" rx="7" fill="#0c666e" />
  <path
    d="M10 6 V26 M10 16 L22 6 M10 16 L23 26"
    fill="none"
    stroke="#ffffff"
    stroke-width="4"
    stroke-linecap="square"
  />
</svg>
